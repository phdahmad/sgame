<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سؤال الأمن السيبراني العشوائي</title>
<style>
body{
margin:0;font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#0b5ed7,#5dade2);
min-height:100vh;display:flex;justify-content:center;align-items:center;
overflow:hidden;transition:.5s;
}
.floating{position:absolute;font-size:28px;opacity:.15;animation:float 12s linear infinite}
@keyframes float{from{transform:translateY(110vh)}to{transform:translateY(-120px)}}
.card{
background:#fff;width:92%;max-width:850px;padding:30px;border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.25);text-align:center;
}
h1{color:#1565c0}
.btn,.option{
border:none;border-radius:14px;padding:15px;margin:10px 0;
font-size:18px;cursor:pointer;width:100%;
}
.btn{background:#1565c0;color:white}
.option{background:#eef5ff}
.option:hover{background:#dbeaff;transform:scale(1.02)}
.correct{background:#b9f6ca!important}
.wrong{background:#ffcdd2!important}
#feedback{margin-top:15px;font-size:22px;font-weight:bold}
.flash-green{background:linear-gradient(135deg,#2e7d32,#66bb6a)!important}
.flash-red{background:linear-gradient(135deg,#b71c1c,#ef5350)!important}
</style>
</head>
<body>

<div class="floating" style="left:10%">🛡️</div>
<div class="floating" style="left:25%;animation-delay:2s">🔒</div>
<div class="floating" style="left:45%;animation-delay:5s">💻</div>
<div class="floating" style="left:65%;animation-delay:1s">🔐</div>
<div class="floating" style="left:85%;animation-delay:4s">🛡️</div>

<div class="card" id="app"></div>

<script>
const questions=[
{q:"ما هو الاختراق الأمني؟",o:["وصول غير مصرح للبيانات","تحديث البرامج","تنظيف الجهاز"],a:0,e:"هو وصول شخص غير مصرح له إلى البيانات أو الأنظمة."},
{q:"أي مما يلي قد يسبب الاختراق؟",o:["روابط مجهولة","كلمة مرور قوية","تحديث الجهاز"],a:0,e:"الروابط المجهولة قد تكون خطيرة."},
{q:"استخدام واي فاي غير محمي آمن.",o:["صح","خطأ"],a:1,e:"الشبكات غير المحمية تعرض البيانات للخطر."},
{q:"من أضرار الاختراق؟",o:["سرقة المعلومات","زيادة السرعة","شحن البطارية"],a:0,e:"قد تتم سرقة المعلومات الشخصية."},
{q:"مشاركة كلمة المرور مع الغرباء آمن.",o:["صح","خطأ"],a:1,e:"لا تشارك كلمة المرور أبداً."},
{q:"أفضل كلمة مرور هي:",o:["123456","password","طويلة ومعقدة"],a:2,e:"الكلمات الطويلة والمعقدة أكثر أماناً."},
{q:"التحديثات الأمنية مهمة.",o:["صح","خطأ"],a:0,e:"التحديثات تسد الثغرات الأمنية."},
{q:"التحقق بخطوتين يزيد الحماية.",o:["صح","خطأ"],a:0,e:"طبقة أمان إضافية مهمة."},
{q:"وصلك رابط جائزة مجهول.",o:["أضغط عليه","أتأكد من المصدر","أرسله للجميع"],a:1,e:"يجب التأكد من المصدر أولاً."},
{q:"لحماية نفسك من الاختراق:",o:["كلمة مرور قوية","مشاركة المعلومات","تجاهل التحديثات"],a:0,e:"ابدئي دائماً بكلمة مرور قوية."}
];

function playTone(notes){
 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 let t=ctx.currentTime;
 notes.forEach(n=>{
   const o=ctx.createOscillator(), g=ctx.createGain();
   o.connect(g); g.connect(ctx.destination);
   o.frequency.value=n;
   o.type='triangle';
   g.gain.setValueAtTime(0.05,t);
   g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
   o.start(t); o.stop(t+0.18);
   t+=0.12;
 });
}
function startSound(){playTone([523,659,784]);}
function successSound(){playTone([659,784,988]);}
function failSound(){playTone([392,330,262]);}

function confetti(){
 for(let i=0;i<20;i++){
   const e=document.createElement('div');
   e.innerHTML=['🎉','✨','⭐'][Math.floor(Math.random()*3)];
   e.style.position='fixed';
   e.style.left=Math.random()*100+'vw';
   e.style.top='-20px';
   e.style.fontSize='30px';
   e.style.transition='3s linear';
   document.body.appendChild(e);
   setTimeout(()=>{e.style.transform='translateY(110vh)';},10);
   setTimeout(()=>e.remove(),3200);
 }
}

function home(){
 app.innerHTML=`
 <h1>🛡️ تحدي الأمن السيبراني</h1>
 <p>اضغطي ابدأ وسيتم سحب سؤال عشوائي واحد.</p>
 <button class="btn" onclick="newQuestion()">🚀 ابدأ اللعبة</button>`;
}

function newQuestion(){
 startSound();
 const q=questions[Math.floor(Math.random()*questions.length)];
 window.currentQ=q;

 app.innerHTML=`
 <h2>🎲 سؤال عشوائي</h2>
 <h1>${q.q}</h1>
 <div id="opts"></div>
 <div id="feedback"></div>`;

 const opts=document.getElementById('opts');

 q.o.forEach((txt,i)=>{
   const b=document.createElement('button');
   b.className='option';
   b.innerText=txt;
   b.onclick=()=>answer(i,b,q);
   opts.appendChild(b);
 });
}

function answer(i,b,q){
 document.querySelectorAll('.option').forEach(x=>x.disabled=true);

 if(i===q.a){
   b.classList.add('correct');
   successSound();
   confetti();
   document.body.classList.add('flash-green');
   feedback.innerHTML=`🎉 أحسنتِ!<br>${q.e}`;
 }else{
   b.classList.add('wrong');
   document.querySelectorAll('.option')[q.a].classList.add('correct');
   failSound();
   document.body.classList.add('flash-red');
   feedback.innerHTML=`❌ الإجابة الصحيحة: <b>${q.o[q.a]}</b><br>${q.e}`;
 }

 setTimeout(()=>{
   document.body.classList.remove('flash-green','flash-red');
 },1200);

 const btn=document.createElement('button');
 btn.className='btn';
 btn.innerHTML='🎲 اسحبي سؤالاً جديداً';
 btn.onclick=newQuestion;
 app.appendChild(btn);
}

home();
</script>
</body>
</html>
